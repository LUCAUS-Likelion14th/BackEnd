# 워크플로우의 이름
name: LUCAUS CICD

# 워크플로우가 실행될 시점(이벤트)을 정의
on:
  # main 브랜치로 push 이벤트가 발생했을 때
  push:
    branches: [ "main", "develop" ]
  # main 브랜치로 pull_request 이벤트가 발생했을 때 (merge 전 검증)
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 'build'라는 이름의 Job 정의
  build:
    # 이 Job을 실행할 가상 머신 환경 (Ubuntu 최신 버전)
    runs-on: ubuntu-latest

    # Job 내부에서 실행될 단계(Step)들
    steps:
      # 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # application.yml을 github actions에서 SECRETS로 관리하며 원격에 생성
      # application.yml 수정한걸 원격에 반영하려면 settings > secrets and variables > actions 에서 수정
      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF

      - name: Create application-dev.yml
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources
          cat > src/main/resources/application-dev.yml <<'EOF'
          ${{ secrets.APPLICATION_DEV_YML }}
          EOF
          cat > src/test/resources/application-dev.yml <<'EOF'
          ${{ secrets.APPLICATION_DEV_YML }}
          EOF

      # application-secret.yml github actions에서 secret으로 관리하며 원격에 생성
      - name: Create application-secret.yml
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources
          cat > src/main/resources/application-secret.yml <<'EOF'
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF
          cat > src/test/resources/application-secret.yml <<'EOF'
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF

      # Gradle 캐시 설정
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle로 빌드 및 테스트
      - name: Build with Gradle
        run: ./gradlew build --stacktrace