spring:
  config:
    import: optional:application-secret.yml
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  jackson:
    property-ordering-strategy: DEFAULT
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

jwt:
  secret: ${JWT_SECRET}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    region:
      static: ${S3_REGION}

stage:
  artist-group-logo-url: ${ARTIST_GROUP_LOGO_URL:}

server:
  forward-headers-strategy: framework
  tomcat:
    max-part-count: 50    # Tomcat 11 기본값 10 → multipart 필드 11개 이상 폼에서 막히는 것 방지

logging:
  file:
    name: /var/log/lucaus/app.log